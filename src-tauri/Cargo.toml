[package]
name = "circinus"
description = "Circinus Mod Manager for RimWorld"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "circinus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
circinus-core = { path = "../crates/circinus-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-notification = "2"
rayon = "1.12.0"
trash = "5"
# The install id comes from the OS random source and nothing else: the privacy page claims it
# is not derived from hardware or an account, and a hash of something real would break that.
# Coarse CPU, core count and memory for a shared run. No GPU: loading is XML and disk, and a
# field that explains none of the variance only makes an install easier to pick out.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
getrandom = "0.3"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
