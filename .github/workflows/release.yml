# Build the installers players download.
#
# Each runner builds the Harmony scanner for its own platform first, then the Tauri bundle with
# the scanner inside it. That is the whole answer to "how does a player get the scanner": they
# do not build anything, and they never see .NET — it is already in the installer.
#
# Push a tag (`v0.2.0`) to make a draft release, or run it by hand from the Actions tab to get
# the installers as artifacts without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites. 22.04 is deliberate: the AppImage links against the glibc
      # of the machine that built it, so building on the oldest distribution we support is what
      # makes it run on the others.
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                                  build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev \
                                  clang zlib1g-dev
        # clang and zlib headers are for the scanner's AOT build, not for Tauri.

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # The scanner, for this platform. It lands in src-tauri/binaries/ with the target triple
      # in its name, which is what Tauri's externalBin wants.
      - name: Build the Harmony scanner
        run: node scripts/sidecar.mjs --target ${{ matrix.target }}

      - name: Check the scanner runs
        shell: bash
        run: |
          dotnet build tools/harmony-scan/testdata/Fixture -c Release --nologo -v quiet
          bin=$(ls src-tauri/binaries/harmony-scan-*)
          "$bin" --pretty tools/harmony-scan/testdata/Fixture/bin/Release/net8.0/FixtureMod.dll > scan.json
          node -e "const r=require('./scan.json').assemblies[0];
            if (r.patches.length !== 6) { console.error('expected 6 patches, got', r.patches.length); process.exit(1); }
            if (!r.harmonyIds.includes('fixture.mod.id')) { console.error('no Harmony id'); process.exit(1); }
            console.log('scanner ok:', r.patches.length, 'patches,', r.manualPatches.length, 'manual');"

      - name: Tests
        run: |
          cargo test --workspace
          npm run check

      # macOS: an unsigned helper inside a signed .app fails notarization, so the scanner has to
      # be signed too. Tauri signs everything in the bundle when these are set; without them the
      # build still succeeds and produces an unsigned app for testing.
      - name: Build the installer
        run: npm run release
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Prove the scanner is actually inside what we are about to hand people. A release that
      # quietly lost its sidecar looks exactly like a working one until somebody opens the
      # Patches view.
      - name: Check the scanner is in the bundle
        shell: bash
        run: |
          root=src-tauri/target/release
          found=$(find "$root/bundle" "$root" -maxdepth 4 -name 'harmony-scan*' -not -path '*/deps/*' 2>/dev/null | head -5)
          if [ -z "$found" ]; then echo "the scanner is not in the build output"; exit 1; fi
          echo "$found"

      - uses: actions/upload-artifact@v4
        with:
          name: circinus-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
