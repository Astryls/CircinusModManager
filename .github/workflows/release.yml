# Build the installers players download.
#
# Push a tag (`v0.2.0`) to make a draft release, or run it by hand from the Actions tab to get
# the installers as artifacts without publishing anything.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites. 22.04 is deliberate: the AppImage links against the glibc
      # of the machine that built it, so building on the oldest distribution we support is what
      # makes it run on the others.
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                                  build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Tests
        run: |
          cargo test --workspace
          npm run check

      # macOS: an unsigned helper inside a signed .app fails notarization, so the scanner has to
      # be signed too. Tauri signs everything in the bundle when these are set; without them the
      # build still succeeds and produces an unsigned app for testing.
      #
      # The updater key is different: it is required. tauri.conf.json carries the public key
      # and asks for updater artifacts, so the build writes a `.sig` beside every installer and
      # fails outright when TAURI_SIGNING_PRIVATE_KEY is missing. The key has no password, so
      # the password variable is set but empty. docs/update-feed.md says where the key comes
      # from and how to make a new one.
      - name: Build the installer
        run: npm run release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # And that every file the updater can be handed has its signature. An installer without
      # one is fine for a person to download and useless to the update feed, and the two look
      # the same in an artifact listing.
      - name: Check the updater signatures
        shell: bash
        run: |
          root=src-tauri/target/release/bundle
          n=0
          for f in "$root"/nsis/*.exe "$root"/msi/*.msi "$root"/macos/*.app.tar.gz "$root"/appimage/*.AppImage "$root"/deb/*.deb; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            if [ ! -s "$f.sig" ]; then echo "no signature beside $f"; exit 1; fi
            echo "signed: $f"
          done
          if [ "$n" = 0 ]; then echo "no updater artifacts were built"; exit 1; fi

      # Everything the site needs for a release upload: the installers people download, the
      # macOS .app.tar.gz the updater installs, and a .sig for each (see docs/update-feed.md).
      - uses: actions/upload-artifact@v4
        with:
          name: circinus-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: warn

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
