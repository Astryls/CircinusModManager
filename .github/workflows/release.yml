# This is the source of truth for .github/workflows/release.yml.
#
# It lives here as well because a workflow file cannot always be written into .github/ from
# where this repo is edited, and a release that never runs because the workflow was never
# copied across is a bad way to find that out. `node tools/setup-release.mjs` copies it into
# place and `node tools/release.mjs` refuses to cut a release when the two have drifted apart.
# Edit this one; never edit the copy.
#
# Build the installers players download, on GitHub's machines. Nobody needs to own a Mac or a
# Linux box: `macos-latest` is Apple Silicon and `ubuntu-22.04` is Linux, and the three jobs
# below are what makes the set that circinus.sh takes.
#
# Push a tag (`v0.2.0`) to build, push to circinus.sh and draft a GitHub release; or run it by
# hand from the Actions tab to get all three as artifacts, publishing nothing. Do that first,
# before the first tag: it is the cheapest way to find out that a platform does not build.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Apple Silicon only: circinus.sh refuses darwin-x86_64 rather than file an Intel
          # binary under Apple Silicon, so an Intel job would build what can never be published.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux prerequisites. 22.04 is deliberate: the AppImage links against the glibc
      # of the machine that built it, so building on the oldest distribution we support is what
      # makes it run on the others.
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                                  build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Tests
        run: |
          cargo test --workspace
          npm run check
          node tools/loadtest/release-args.mjs

      # macOS: an unsigned helper inside a signed .app fails notarization, so the scanner has to
      # be signed too. Tauri signs everything in the bundle when these are set; without them the
      # build still succeeds and produces an unsigned app for testing.
      #
      # The updater key is different: it is required. tauri.conf.json carries the public key
      # and asks for updater artifacts, so the build writes a `.sig` beside every installer and
      # fails outright when TAURI_SIGNING_PRIVATE_KEY is missing. The key has no password, so
      # the password variable is set but empty. docs/update-feed.md says where the key comes
      # from and how to make a new one.
      - name: Build the installer
        run: npm run release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # And that every file the updater can be handed has its signature. An installer without
      # one is fine for a person to download and useless to the update feed, and the two look
      # the same in an artifact listing.
      - name: Check the updater signatures
        shell: bash
        run: |
          root=src-tauri/target/release/bundle
          n=0
          for f in "$root"/nsis/*.exe "$root"/msi/*.msi "$root"/macos/*.app.tar.gz "$root"/appimage/*.AppImage "$root"/deb/*.deb; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            if [ ! -s "$f.sig" ]; then echo "no signature beside $f"; exit 1; fi
            echo "signed: $f"
          done
          if [ "$n" = 0 ]; then echo "no updater artifacts were built"; exit 1; fi

      # A build for a platform you do not own is still worth opening once. These do not run the
      # app, which would want a display, but they prove the bundle is a bundle and that the Mac
      # binary is the architecture the site accepts. A wrong-architecture Mac build is otherwise
      # found at the upload, after everything else has already taken twenty minutes.
      - name: Open the bundle once
        shell: bash
        run: |
          set -e
          root=src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            Linux)
              app=$(readlink -f "$(ls "$root"/appimage/*.AppImage | head -1)")
              chmod +x "$app"
              cd "$(mktemp -d)"
              "$app" --appimage-extract >/dev/null
              echo "the AppImage extracts cleanly: $(basename "$app")"
              ;;
            macOS)
              tarball=$(ls "$root"/macos/*.app.tar.gz | head -1)
              d=$(mktemp -d)
              tar -xzf "$tarball" -C "$d"
              bin=$(find "$d" -type f -perm +111 -path '*/Contents/MacOS/*' | head -1)
              [ -n "$bin" ] || { echo "nothing executable inside the app bundle"; exit 1; }
              file "$bin"
              file "$bin" | grep -q arm64 || { echo "not an Apple Silicon binary, which the site refuses"; exit 1; }
              app=$(dirname "$(dirname "$(dirname "$bin")")")
              codesign -dv "$app" 2>&1 | head -3 || echo "not code signed: macOS will warn on first open until an Apple certificate is set"
              ;;
            Windows)
              exe=$(ls "$root"/nsis/*-setup.exe | head -1)
              echo "the installer is $(wc -c < "$exe") bytes: $(basename "$exe")"
              ;;
          esac

      # Everything the site needs for a release upload: the installers people download, the
      # macOS .app.tar.gz the updater installs, and a .sig for each (see docs/update-feed.md).
      - uses: actions/upload-artifact@v4
        with:
          name: circinus-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: warn

  # Everything the three builds made, sent to circinus.sh and published there. This is what an
  # installed copy will be offered; the GitHub draft below is a copy for people who come looking
  # on GitHub. tools/push-build.mjs is the whole interface and refuses before it sends anything
  # that would publish a build the updater cannot install.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # At the job level so the steps below can ask whether the key exists: a step's own `env` is
    # not in scope for its own `if`.
    env:
      CIRCINUS_BUILD_KEY: ${{ secrets.CIRCINUS_BUILD_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tag's own message becomes the release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Push it to circinus.sh
        if: env.CIRCINUS_BUILD_KEY != ''
        run: node tools/push-build.mjs --version "${GITHUB_REF_NAME#v}" --dir artifacts
      - name: Say why nothing was pushed
        if: env.CIRCINUS_BUILD_KEY == ''
        run: |
          echo "No CIRCINUS_BUILD_KEY secret, so this build was not sent to circinus.sh."
          echo "Make a build key at https://circinus.sh/admin under Mod Manager builds, then add"
          echo "it as the repository secret CIRCINUS_BUILD_KEY. The installers are still attached"
          echo "to the draft release below."

  draft:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
