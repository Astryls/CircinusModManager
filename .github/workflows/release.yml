# This is the source of truth for .github/workflows/release.yml.
#
# It lives here as well because a workflow file cannot always be written into .github/ from
# where this repo is edited, and a release that never runs because the workflow was never
# copied across is a bad way to find that out. `node tools/setup-release.mjs` copies it into
# place and `node tools/release.mjs` refuses to cut a release when the two have drifted apart.
# Edit this one; never edit the copy.
#
# Build the installers players download, on GitHub's machines. Nobody needs to own a Mac or a
# Linux box: `macos-latest` is Apple Silicon and `ubuntu-22.04` is Linux, and the three jobs
# below are what makes the set that circinus.sh takes.
#
# There are three ways in, and the first is the one to use:
#
#   Actions -> Release -> Run workflow, type a version    releases it, start to finish
#   Actions -> Release -> Run workflow, leave it empty    builds all three, publishes nothing
#   push a tag (`v0.2.0`)                                 releases it, from a terminal
#
# The empty one is a rehearsal and costs nothing but minutes. Do it before the first release of
# a version that changed the build: it is the cheapest way to find out that a platform no longer
# compiles.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.1. Leave empty to build all three and publish nothing."
        required: false
        default: ""
      notes:
        description: "What changed, in a sentence or two. Players read this on the download page and in the update banner."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Given a version, do what a person would have done at a terminal before pushing a tag: set it
  # in the three files that carry it, commit, tag, push. tools/release.mjs is that work and has
  # the guards on it -- a version that is not newer than the last one, a tag that already exists,
  # a version the three files disagree about -- so this runs that rather than a second copy of it
  # written in YAML. The jobs below then build the commit it made.
  #
  # A tag pushed by a workflow does not start another workflow run, which is what we want here:
  # this run carries on and builds it, instead of a second run starting from the tag.
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cut.outputs.version }}
      sha: ${{ steps.cut.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # so it can see the last tag and refuse to go backwards
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Only so that `cargo update --workspace` can follow Cargo.toml's new version into
      # Cargo.lock. Without it the tagged commit carries a lock that disagrees with the manifest
      # beside it, which costs nothing until the day something builds with --locked and the only
      # commit that fails is the one every release is cut from.
      - uses: dtolnay/rust-toolchain@stable
      - name: Set the version, commit and tag
        id: cut
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -e
          if [ -n "$NOTES" ]; then
            node tools/release.mjs "$VERSION" --tag-only --notes "$NOTES"
          else
            node tools/release.mjs "$VERSION" --tag-only
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    # `tag` is skipped for a tag push and for a rehearsal, and a skipped job must not take the
    # builds down with it. Only its failing does that.
    if: ${{ !cancelled() && needs.tag.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Apple Silicon only: circinus.sh refuses darwin-x86_64 rather than file an Intel
          # binary under Apple Silicon, so an Intel job would build what can never be published.
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}

    steps:
      # The commit the tag job just made, when there was one; otherwise whatever started this run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}

      # Tauri's Linux prerequisites. 22.04 is deliberate: the AppImage links against the glibc
      # of the machine that built it, so building on the oldest distribution we support is what
      # makes it run on the others.
      - name: Linux prerequisites
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
                                  build-essential curl wget file libssl-dev libxdo-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Tests
        run: |
          cargo test --workspace
          npm run check
          node tools/loadtest/release-args.mjs

      # macOS: an unsigned helper inside a signed .app fails notarization, so the scanner has to
      # be signed too. Tauri signs everything in the bundle when these are set; without them the
      # build still succeeds and produces an unsigned app for testing.
      #
      # The updater key is different: it is required. tauri.conf.json carries the public key
      # and asks for updater artifacts, so the build writes a `.sig` beside every installer and
      # fails outright when TAURI_SIGNING_PRIVATE_KEY is missing. The key has no password, so
      # the password variable is set but empty. docs/update-feed.md says where the key comes
      # from and how to make a new one.
      - name: Build the installer
        run: npm run release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # And that every file the updater can be handed has its signature. An installer without
      # one is fine for a person to download and useless to the update feed, and the two look
      # the same in an artifact listing.
      - name: Check the updater signatures
        shell: bash
        run: |
          root=src-tauri/target/release/bundle
          n=0
          for f in "$root"/nsis/*.exe "$root"/msi/*.msi "$root"/macos/*.app.tar.gz "$root"/appimage/*.AppImage "$root"/deb/*.deb; do
            [ -e "$f" ] || continue
            n=$((n + 1))
            if [ ! -s "$f.sig" ]; then echo "no signature beside $f"; exit 1; fi
            echo "signed: $f"
          done
          if [ "$n" = 0 ]; then echo "no updater artifacts were built"; exit 1; fi

      # A build for a platform you do not own is still worth opening once. These do not run the
      # app, which would want a display, but they prove the bundle is a bundle and that the Mac
      # binary is the architecture the site accepts. A wrong-architecture Mac build is otherwise
      # found at the upload, after everything else has already taken twenty minutes.
      - name: Open the bundle once
        shell: bash
        run: |
          set -e
          root=src-tauri/target/release/bundle
          case "${{ runner.os }}" in
            Linux)
              app=$(readlink -f "$(ls "$root"/appimage/*.AppImage | head -1)")
              chmod +x "$app"
              cd "$(mktemp -d)"
              "$app" --appimage-extract >/dev/null
              echo "the AppImage extracts cleanly: $(basename "$app")"
              ;;
            macOS)
              tarball=$(ls "$root"/macos/*.app.tar.gz | head -1)
              d=$(mktemp -d)
              tar -xzf "$tarball" -C "$d"
              bin=$(find "$d" -type f -perm +111 -path '*/Contents/MacOS/*' | head -1)
              [ -n "$bin" ] || { echo "nothing executable inside the app bundle"; exit 1; }
              file "$bin"
              file "$bin" | grep -q arm64 || { echo "not an Apple Silicon binary, which the site refuses"; exit 1; }
              app=$(dirname "$(dirname "$(dirname "$bin")")")
              codesign -dv "$app" 2>&1 | head -3 || echo "not code signed: macOS will warn on first open until an Apple certificate is set"
              ;;
            Windows)
              exe=$(ls "$root"/nsis/*-setup.exe | head -1)
              echo "the installer is $(wc -c < "$exe") bytes: $(basename "$exe")"
              ;;
          esac

      # Everything the site needs for a release upload: the installers people download, the
      # macOS .app.tar.gz the updater installs, and a .sig for each (see docs/update-feed.md).
      - uses: actions/upload-artifact@v4
        with:
          name: circinus-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: warn

  # Everything the three builds made, sent to circinus.sh and published there. This is what an
  # installed copy will be offered; the GitHub draft below is a copy for people who come looking
  # on GitHub. tools/push-build.mjs is the whole interface and refuses before it sends anything
  # that would publish a build the updater cannot install.
  publish:
    needs: [tag, build]
    # A release happens when a tag was pushed, or when this run made one. A rehearsal made
    # neither, and stops here with three artifacts and nothing published.
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || needs.tag.outputs.version != '') }}
    runs-on: ubuntu-latest
    # At the job level so the steps below can ask whether the key exists: a step's own `env` is
    # not in scope for its own `if`.
    env:
      CIRCINUS_BUILD_KEY: ${{ secrets.CIRCINUS_BUILD_KEY }}
      VERSION: ${{ needs.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}
          fetch-depth: 0 # the tag's own message becomes the release notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Push it to circinus.sh
        if: env.CIRCINUS_BUILD_KEY != ''
        # The version came either from the button or from the tag that started this run.
        run: node tools/push-build.mjs --version "${VERSION:-${GITHUB_REF_NAME#v}}" --dir artifacts
      - name: Say why nothing was pushed
        if: env.CIRCINUS_BUILD_KEY == ''
        run: |
          echo "No CIRCINUS_BUILD_KEY secret, so this build was not sent to circinus.sh."
          echo "Make a build key at https://circinus.sh/admin under Mod Manager builds, then add"
          echo "it as the repository secret CIRCINUS_BUILD_KEY. The installers are still attached"
          echo "to the draft release below."

  draft:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/') || needs.tag.outputs.version != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          # Named explicitly: on a tag push this run is already at the tag, but a run started
          # from the button is on a branch, and a release drafted against a branch name is not
          # attached to the version anyone is looking for.
          tag_name: ${{ needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version) || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
