[workspace]
resolver = "2"
members = ["crates/circinus-core", "src-tauri"]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT"
authors = ["Circinus contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Folder walking and XML parsing are hot even in dev builds; keep them optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
